# Tek servis. Kalıcı birim (volume) YOK: oyun durumu tamamen bellekte yaşar.
# Konteyner yeniden başlarsa açık odalar kaybolur — tasarım gereği böyle.
#
# Port dışarıya yayınlanmaz. Trafiğe tek giriş, aynı Docker ağındaki Caddy'dir.
# Ağın adı sunucudaki mevcut Caddy'ninkiyle aynı olmalı; nasıl bulacağın
# README'nin "Dağıtım" bölümünde. Farklıysa CADDY_NETWORK ile geç:
#   CADDY_NETWORK=agin-adi docker compose up -d --build

services:
  app:
    build: .
    container_name: butce-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    networks:
      - caddy

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy_default}
